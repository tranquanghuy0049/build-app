name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the bundle"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "v*"

jobs:
  # Apple Silicon only, deliberately.
  #
  # There used to be a second leg on macos-13 for Intel. GitHub has retired its
  # hosted Intel macOS runners, so that leg no longer gets scheduled at all: it
  # sat in the queue for the full 24-hour limit and then failed the whole run —
  # including the release step — even though the arm64 dmg had been built
  # successfully in eleven minutes.
  #
  # packaging/build_macos.sh still keeps its x86_64 branch (torch pinned to
  # 2.2.2, the last macOS Intel wheel), so anyone with a physical Intel Mac can
  # produce that dmg by running the script there. See MACOS.md.
  build:
    name: Apple Silicon (M1/M2/M3/M4)
    runs-on: macos-14
    timeout-minutes: 90

    # Required by the release step: without it the default token is read-only
    # and attaching the dmg fails with 403.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner architecture
        run: |
          uname -m
          python3 -c "import platform; print(platform.machine(), platform.mac_ver())"
          df -h /

      - name: Build .app and .dmg
        working-directory: meeting_summarizer
        env:
          APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: bash packaging/build_macos.sh

      - name: Smoke test the bundle
        working-directory: meeting_summarizer
        run: bash packaging/smoke_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MeetingSummarizer-macos-arm64
          path: meeting_summarizer/dist/*.dmg
          if-no-files-found: error
          # The payload is mostly already-compressed torch dylibs.
          compression-level: 0
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: meeting_summarizer/dist/*.dmg
