name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the installer"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    # Longer than the macOS job by design: the CPU torch wheels, a 587 MB model
    # and Inno Setup's solid LZMA2 pass over a multi-gigabyte payload each take
    # real time, and the compression is single-threaded.
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner state
        run: |
          python -c "import platform, sys; print(platform.machine(), sys.version)"
          Get-PSDrive C | Select-Object Used, Free

      # build_windows.ps1 creates this itself with `py -3`, which on a runner is
      # whatever the launcher happens to point at rather than the version pinned
      # above. Creating it here is how 3.11 actually gets used.
      - name: Create the build virtualenv with the pinned Python
        working-directory: meeting_summarizer
        run: python -m venv .venv-build

      - name: Install Inno Setup
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if ($paths | Where-Object { Test-Path $_ }) {
            Write-Host "Inno Setup already present"
          } else {
            choco install innosetup --no-progress -y
          }

      - name: Build the bundle and the installer
        working-directory: meeting_summarizer
        env:
          APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1

      # build_windows.ps1 treats the installer as optional so a developer without
      # Inno Setup still gets a working dist folder. Here it is the whole point,
      # so a missing .exe has to fail the job rather than publish nothing.
      - name: Check the installer was produced
        working-directory: meeting_summarizer
        run: |
          $exe = Get-ChildItem dist\*-win64-setup.exe -ErrorAction SilentlyContinue
          if (-not $exe) { throw "No installer in dist\ — Inno Setup did not run" }
          $exe | ForEach-Object { "{0}  {1} MB" -f $_.Name, [math]::Round($_.Length/1MB) }

      # Start-Process -Wait, not `&`: the bundle is a windowed exe, and PowerShell
      # hands control straight back for those rather than waiting — the first
      # version of this step read a stale $LASTEXITCODE while the app was still
      # importing torch. A windowed bundle also has no stdout to inherit, so
      # everything the selftest prints goes to launcher.log and has to be fetched
      # from there; without it a failure here says only "exit 1".
      - name: Dependency selftest
        working-directory: meeting_summarizer
        run: |
          $log = "$env:APPDATA\MeetingSummarizer\launcher.log"
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process -FilePath dist\MeetingSummarizer\MeetingSummarizer.exe `
                 -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "selftest failed (exit $($p.ExitCode))" }

      # Not allowed to fail the build: this one needs a text-to-speech voice
      # installed to synthesise its test audio, and a Windows Server image is not
      # guaranteed to carry one. Its result is still worth reading in the log.
      - name: Real transcription with the bundled model
        working-directory: meeting_summarizer
        continue-on-error: true
        run: |
          $log = "$env:APPDATA\MeetingSummarizer\launcher.log"
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process -FilePath dist\MeetingSummarizer\MeetingSummarizer.exe `
                 -ArgumentList '--selftest-transcribe' -Wait -PassThru -NoNewWindow
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "transcribe selftest failed (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: MeetingSummarizer-windows-x64
          path: meeting_summarizer/dist/*-win64-setup.exe
          if-no-files-found: error
          # Already LZMA2-compressed by Inno Setup.
          compression-level: 0
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: meeting_summarizer/dist/*-win64-setup.exe
